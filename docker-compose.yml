services:
  postgres:
    image: postgres:15
    container_name: signalstock-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: signalstock
      POSTGRES_USER: signalstock
      POSTGRES_PASSWORD: signalstock_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalstock"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: signalstock-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  scraper:
    build: ./services/scraper
    env_file: ./services/scraper/.env
    environment:
      # Override .env localhost values with Docker service hostnames
      DATABASE_URL: postgresql://signalstock:signalstock_dev@postgres:5432/signalstock
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  classifier:
    build: ./services/classifier
    env_file: ./services/classifier/.env
    environment:
      # Override .env localhost values with Docker service hostnames
      DATABASE_URL: postgresql://signalstock:signalstock_dev@postgres:5432/signalstock
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mapper:
    build: ./services/mapper
    env_file: ./services/mapper/.env
    environment:
      # Override .env localhost values with Docker service hostnames
      DATABASE_URL: postgresql://signalstock:signalstock_dev@postgres:5432/signalstock
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  alerts:
    build: ./services/alerts
    env_file: ./services/alerts/.env
    environment:
      DATABASE_URL: postgresql://signalstock:signalstock_dev@postgres:5432/signalstock
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: ./services/api
    env_file: ./services/api/.env
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://signalstock:signalstock_dev@postgres:5432/signalstock
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
